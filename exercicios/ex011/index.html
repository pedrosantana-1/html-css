<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
<p>Tente abrir essas imagens em vários dispositivos ou simplesmente aumente e diminua o tamanho do navegador</p>
<picture>
    <source media="(max-width: 750px)" srcset="imagens/foto-300.png" type="image/png">
    <source media="(max-width: 1050px)" srcset="imagens/foto-700.png" type="image/png">
    <img src="imagens/foto-1000.png" alt="Imagem flexível">
</picture>
<h1>Reproduzindo áudio</h1>
<p>Vamos aprender a reproduzir áudios em HTML5</p>
<audio source src="midia/inter-galatic.mp3" type="audio/mpeg" ></audio>
</body>
</html>
